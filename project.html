  <!-- Arriving half of the #092 shutter (never under reduced motion; a safety timer uncovers). -->
  <script>
    (function () {
      var d = document.documentElement; d.classList.add('js');
      try {
        var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || localStorage.getItem('kc:motion') === 'off';
        d.dataset.motion = reduce ? 'off' : 'on';
        if (!reduce && sessionStorage.getItem('kc:shutter')) d.classList.add('shutter-cover');
        sessionStorage.removeItem('kc:shutter');
      } catch (e) { /* storage blocked */ }
      setTimeout(function () { d.classList.remove('shutter-cover'); }, 3000);
    })();
  </script>
</head>
